name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPAMRETRIES: 3
  DOCKER_IMAGE: pwbsladek/croncheck
  DHI_RUNTIME_IMAGE: dhi.io/debian-base:bookworm

jobs:
  build-artifacts:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: croncheck-linux-x86_64
            exe: ""
          - runner: ubuntu-24.04-arm
            artifact: croncheck-linux-arm64
            exe: ""
          - runner: macos-15-intel
            artifact: croncheck-macos-x86_64
            exe: ""
          - runner: macos-15
            artifact: croncheck-macos-arm64
            exe: ""
          - runner: windows-2025
            artifact: croncheck-windows-x86_64
            exe: ".exe"
    runs-on: ${{ matrix.runner }}

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ocaml/setup-ocaml@v3.9.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        shell: bash
        run: |
          opam pin add --yes --no-action --kind=path croncheck .
          opam install --yes --deps-only --with-test croncheck

      - name: Substitute version
        shell: bash
        run: opam exec -- dune subst

      - name: Build binary
        shell: bash
        run: |
          opam exec -- dune build --profile release bin/main.exe

      - name: Smoke test binary
        shell: bash
        run: |
          _build/default/bin/main.exe --help | grep -F "Static analysis"

      - name: Package binary
        shell: bash
        run: |
          artifact="${{ matrix.artifact }}"
          exe="${{ matrix.exe }}"
          mkdir -p dist
          cp _build/default/bin/main.exe "dist/$artifact$exe"
          chmod +x "dist/$artifact$exe"
          tar -C dist -czf "$artifact.tar.gz" "$artifact$exe"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          else
            shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          fi

      - name: Upload artifact
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

      - name: Download artifact for smoke test
        # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: downloaded

      - name: Smoke test release artifact
        shell: bash
        run: |
          artifact="${{ matrix.artifact }}"
          exe="${{ matrix.exe }}"
          cd downloaded
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$artifact.tar.gz.sha256"
          else
            shasum -a 256 -c "$artifact.tar.gz.sha256"
          fi
          cd ..
          mkdir -p smoke
          tar -C smoke -xzf "downloaded/$artifact.tar.gz"
          "smoke/$artifact$exe" --help | grep -F "Static analysis"

  publish:
    name: Publish GitHub release
    needs: build-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: croncheck-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Create GitHub release
        # softprops/action-gh-release@v3.0.4
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  publish-docker:
    name: Publish Docker image
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      # docker/setup-buildx-action@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to DHI registry
        # docker/login-action@v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        # docker/login-action@v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        # docker/metadata-action@v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        # docker/build-push-action@v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DHI_RUNTIME_IMAGE=${{ env.DHI_RUNTIME_IMAGE }}
            CRONCHECK_VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
