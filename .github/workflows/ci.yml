name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPAMRETRIES: 3

jobs:
  build-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["4.14", "5.2"]
    runs-on: ${{ matrix.os }}

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ocaml/setup-ocaml@v3.9.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: |
          opam pin add --yes --no-action --kind=path croncheck .
          opam install --yes --deps-only --with-test croncheck

      - name: Build
        run: opam exec -- make build

      - name: Test
        run: opam exec -- make test

      - name: Integration test
        run: opam exec -- make integration-test

  opam-lint:
    name: Opam lint
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ocaml/setup-ocaml@v3.9.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: "5.2"

      - name: Lint opam package
        run: opam exec -- make opam-lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ocaml/setup-ocaml@v3.9.1
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: "5.2"

      - name: Install formatter
        run: opam install --yes dune ocamlformat.0.29.0

      - name: Check formatting
        run: opam exec -- make fmt-check
